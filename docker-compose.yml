version: '3.8'

services:
  # 1. PostgreSQL 
  postgres:
    image: postgres:15-alpine
    container_name: workspace_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: workspace_db
    ports:
      - "5432:5432"
    volumes:
      - workspace_pg_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d workspace_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 2. Redis for Pub/Sub & WebSockets
  redis:
    image: redis:7-alpine
    container_name: workspace_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - workspace_redis_data:/data
    networks:
      - app_network

  # 3. Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workspace_backend
    restart: always
    ports:
      - "5050:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/workspace_db?schema=public&sslmode=disable"
      JWT_SECRET: "your_jwt_secret_key"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  # 4. React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workspace_frontend
    restart: always
    ports:
      - "3030:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  workspace_pg_data:
  workspace_redis_data:

networks:
  app_network:
    driver: bridge
